<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vail Disco | Official Site</title>

    <!-- Discord Info Card (Open Graph) Meta Tags -->
    <meta property="og:title" content="The Vail Disco's Channel">
    <meta property="og:description" content="show's latest uploads. and a place to buy merch {if there is}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourwebsite.com"> <!-- Replace with your actual link later -->
    <meta property="og:image" content="https://images.unsplash.com/photo-1514525253361-bee8a4874093?q=80&w=500"> <!-- Preview Image -->
    <meta name="theme-color" content="#8a2be2"> <!-- The color bar on the side of the Discord card -->

    <style>
        :root {
            --primary-color: #8a2be2;
            --secondary-color: #00d4ff;
            --discord-color: #5865F2;
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
        }

        /* ... (Rest of your original CSS stays exactly the same) ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: rgba(0, 0, 0, 0.9);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary-color);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--secondary-color);
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: var(--primary-color);
        }

        /* Hero Section */
        .hero {
            height: 60vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1514525253361-bee8a4874093?auto=format&fit=crop&q=80&w=1500');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 5px solid var(--primary-color);
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px var(--primary-color);
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 30px;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
        }

        .btn:hover {
            background: var(--secondary-color);
            transform: scale(1.05);
        }

        /* Discord Section */
        .discord-section {
            background: #111;
            padding: 60px 5%;
            text-align: center;
            border-top: 1px solid #222;
        }

        .discord-btn {
            background: var(--discord-color);
            padding: 15px 40px;
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
        }

        .discord-btn:hover {
            background: #4752c4;
            box-shadow: 0 0 25px rgba(88, 101, 242, 0.6);
        }

        /* Video Section */
        .content-section {
            padding: 50px 5%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            transition: 0.3s;
        }

        .video-card:hover {
            transform: translateY(-5px);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
            overflow: hidden;
        }

        .thumbnail-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            opacity: 0.8;
            z-index: 2;
            pointer-events: none;
        }

        .video-info {
            padding: 15px;
        }

        .video-info h3 {
            margin-bottom: 10px;
            font-size: 1rem;
            color: var(--text-color);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            nav ul { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">The Vail Disco</div>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#videos">Videos</a></li>
            <li><a href="merch.html">Merch</a></li>
            <li><a href="https://discord.gg/d5SP3AVmTy" target="_blank">Discord</a></li>
        </ul>
    </nav>

    <header class="hero" id="home">
        <h1>THE VAIL DISCO</h1>
        <p>Gaming • Commentary • Chaos</p>
        <a href="https://www.youtube.com/channel/UCOa_tsIYL9bcHUXZbNbWjuA" target="_blank" class="btn">SUBSCRIBE NOW</a>
    </header>

    <section class="content-section" id="videos">
        <h2 class="section-title">Latest Uploads</h2>
        <div class="video-grid" id="youtube-grid">
            <p style="text-align: center; grid-column: 1/-1;">Loading awesome content...</p>
        </div>
    </section>

    <div class="discord-section">
        <h2 style="margin-bottom: 20px;">Want more chaos?</h2>
        <a href="https://discord.gg/d5SP3AVmTy" target="_blank" class="btn discord-btn">JOIN THE DISCORD</a>
    </div>

    <footer>
        <p>&copy; 2026 The Vail Disco. All rights reserved.</p>
        <p>Designed for the fans.</p>
    </footer>

    <script>
        const API_KEY = 'AIzaSyDsrdbg-t1hpH0YayTzH-7UjgLSw_cQxIk';
        const CHANNEL_ID = 'UCOa_tsIYL9bcHUXZbNbWjuA';
        const videoGrid = document.getElementById('youtube-grid');

        async function fetchVailDiscoVideos() {
            const url = `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet,id&order=date&maxResults=6&type=video`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.items) {
                    videoGrid.innerHTML = '';
                    data.items.forEach(item => {
                        const videoId = item.id.videoId;
                        const title = item.snippet.title;
                        const thumb = item.snippet.thumbnails.high.url;

                        videoGrid.innerHTML += `
                            <div class="video-card">
                                <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" style="text-decoration: none;">
                                    <div class="thumbnail-container">
                                        <span class="play-overlay">▶️</span>
                                        <img src="${thumb}" alt="${title}">
                                    </div>
                                    <div class="video-info">
                                        <h3>${title}</h3>
                                        <p style="font-size: 0.8rem; color: var(--secondary-color);">Watch on YouTube →</p>
                                    </div>
                                </a>
                            </div>
                        `;
                    });
                } else {
                    videoGrid.innerHTML = '<p>No videos found or API error.</p>';
                }
            } catch (error) {
                console.error("Error loading YouTube videos:", error);
                videoGrid.innerHTML = '<p>Failed to load videos.</p>';
            }
        }

        fetchVailDiscoVideos();
    </script>

</body>
</html>
